[build]
target-dir = "target/generate"

[alias]
build-desktop-release = [
  "build",
  "--manifest-path",
  "apps/desktop/src-tauri/Cargo.toml",
  "--release",
  "--bins",
  "--features",
  "desktop-distribution",
]
stage-desktop-release = [
  "run",
  "--manifest-path",
  "apps/desktop/src-tauri/Cargo.toml",
  "--release",
  "--bin",
  "stage-desktop-release",
  "--features",
  "desktop-distribution",
]
