[package]
name = "servo"
description = "Servo model definitions, register protocols, device drivers, and test doubles."
# Owns device facts and servo I/O, including units, capabilities, and register behavior.
# duck-body owns joint geometry and actuator mounting. loop-body owns the body backend
# contract, including body feedback and execution timing. Applications assemble devices.
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustypot.workspace = true
serialport.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
duck-control = { path = "../../vendor/microduck/duck-control" }

[[test]]
name = "servo"
path = "tests/servo.rs"
