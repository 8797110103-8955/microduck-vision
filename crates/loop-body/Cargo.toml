[package]
name = "loop-body"
description = "Product-agnostic servo-backed body control loop and backend boundary."
# The boundary excludes body assets, servo register facts, policy files, policy contracts, and UI
# state. Product applications inject canonical targets or a controller around the body loop.
# The instance registry owns generic factories and access leases; product backends stay in apps.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
duck-body = { path = "../duck-body" }
servo = { path = "../servo" }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "body_loop"
path = "tests/body_loop.rs"
