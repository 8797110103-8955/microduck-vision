[package]
name = "duck-body"
description = "Shared robot body interface for canonical joints, kinematics, and dynamics."
# Load the pinned official body descriptions directly from vendor/ and use its kinematics API.
# Expose the result through one typed Rust interface for body identity and version, joint order
# and limits, actuator mounting, and reference poses. Adapt only gaps in the upstream sources.
# Uses servo model facts and supplied calibration for coordinate transforms. loop-body runs
# the control cycle against this body model. Applications assemble simulated and physical
# machines, define policy observation and action layouts, and manage calibration, ONNX loading,
# training, and preview workflows. These workflows consume the same body definition.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[dependencies]
duck-ipc-proto = { path = "../../vendor/microduck/duck-ipc-proto" }
kinematics = { path = "../../vendor/microduck/kinematics" }
roxmltree = "0.21.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
servo = { path = "../servo" }

[[test]]
name = "duck_body"
path = "tests/duck_body.rs"
