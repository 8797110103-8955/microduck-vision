[package]
name = "microduck-vision-generate-types"
description = "Build tool that generates TypeScript bindings for the desktop IPC contract."
# Reads command signatures and types from the desktop sources. The desktop application owns
# the IPC contract and runtime behavior; this crate owns TypeScript binding generation.
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["typescript"] }
tauri = { version = "2.12.5", default-features = false, features = ["test"] }

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }
