[package]
name = "microduck-vision"
description = "Desktop application for configuring, simulating, and controlling MicroDuck machines."
# Assembles servo I/O and loop-body sessions with microduck-body-runtime execution models.
# Starts microduck-training and adapts desktop body selections, previews, and ONNX contracts.
# Owns machine instances, backend and controller selection, MicroDuck policy workflows,
# persistence, Windows integration, and the desktop IPC surface.
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "microduck-vision"

[features]
desktop-distribution = ["tauri/custom-protocol", "microduck-training/packaged-python"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
  "system-proxy",
] }
sha2 = "0.10"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
duck-body = { path = "../../../crates/duck-body" }
microduck-body-runtime = { path = "../../body-runtime", features = ["native"] }
microduck-training = { path = "../../training" }
loop-body = { path = "../../../crates/loop-body" }
servo = { path = "../../../crates/servo" }
duck-control = { path = "../../../vendor/microduck/duck-control" }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
md-5 = "0.10.6"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-snap-layout = "1.0.9"
serialport = { version = "4.10.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
  "system-proxy",
] }
tauri-plugin-opener = "2.7.3"
mcap = { version = "0.26.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[[bin]]
name = "microduck-vision"
path = "src/main.rs"

[[bin]]
name = "stage-desktop-release"
path = "release.rs"
required-features = ["desktop-distribution"]

