[project]
name = "microduck-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mjlab-microduck", "torch==2.9.1"]

[tool.uv]
package = false
# Keep the upstream BAM overrides when resolving from the desktop project.
override-dependencies = ["protobuf>=4.0,<7.0", "onnx>=1.20.1", "zmq ; python_version < '3.0'"]

[tool.uv.sources]
mjlab-microduck = { path = "../../vendor/microduck_rl", editable = true }
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", branch = "mjlab_frictionloss" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
