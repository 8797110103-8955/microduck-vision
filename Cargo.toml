[workspace]
resolver = "3"
members = ["crates/servo", "crates/duck-body", "crates/loop-body"]
exclude = ["vendor", "old", "apps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
rustypot = "1.13.1"
serialport = { version = "4.10.1", default-features = false }
thiserror = "2.0.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
